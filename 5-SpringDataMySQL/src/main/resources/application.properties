spring.application.name=SpringDataMySQL

server.port=8081

# Database URL, username, and password
spring.datasource.url=jdbc:mysql://localhost:3306/SpringDataMySQL?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatic schema and data initialization
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Hibernate settings to automatically create/update the schema

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect



# Enable SQL initialization for both schema and data files
spring.sql.init.mode=always

spring.sql.init.continue-on-error=true