<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title
            th:text="${formMode == 'edit'}
                ? 'Edit Product'
                : 'Add Product'">

        Product

    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            background: #f7f7f5;

            color: #292929;

            font-size: 14px;
        }


        button,
        input,
        select,
        textarea {

            font: inherit;
        }


        button {

            cursor: pointer;
        }


        .page-shell {

            min-height: 100vh;

            padding: 28px;

            display: flex;

            justify-content: center;

            align-items: flex-start;
        }


        .form-card {

            width: 700px;

            background: white;

            border: 1px solid #dededb;

            border-radius: 6px;

            padding: 18px 22px 22px;

            box-shadow:
                    0 1px 2px
                    rgba(0, 0, 0, 0.04);
        }


        .breadcrumb {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 18px;

            color: #767676;

            font-size: 12px;
        }


        .breadcrumb a {

            color: #767676;

            text-decoration: none;
        }


        .breadcrumb strong {

            color: #333333;
        }


        .separator {

            color: #aaaaaa;
        }


        .grid-icon {

            color: #666666;

            font-size: 16px;
        }


        .demo-toolbar {

            display: flex;

            gap: 8px;

            margin-bottom: 20px;
        }


        .demo-button {

            padding: 8px 14px;

            background: #ffffff;

            border: 1px solid #d3d3cf;

            border-radius: 6px;

            color: #3f3f3f;

            font-size: 12px;
        }


        .demo-button:hover {

            background: #f7f7f5;
        }


        .validation-summary {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px 12px;

            margin-bottom: 22px;

            background: #fff4f2;

            border: 1px solid #dc786f;

            border-radius: 5px;

            color: #a23b35;

            font-size: 12px;
        }


        .validation-icon {

            width: 16px;

            height: 16px;

            display: inline-flex;

            justify-content: center;

            align-items: center;

            border: 1px solid #c45d54;

            border-radius: 50%;

            font-size: 10px;

            font-weight: bold;
        }


        .section-header {

            padding-bottom: 7px;

            margin-top: 16px;

            margin-bottom: 14px;

            border-bottom: 1px solid #e4e4e1;

            color: #777777;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.4px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                    minmax(0, 1fr)
                    minmax(0, 1fr);

            column-gap: 18px;

            row-gap: 16px;
        }


        .form-group {

            min-width: 0;

            margin-bottom: 14px;
        }


        .form-group label {

            display: block;

            margin-bottom: 6px;

            color: #414141;

            font-size: 12px;

            font-weight: 500;
        }


        .required {

            color: #b9433c;
        }


        .field-hint {

            margin-left: 4px;

            color: #989898;

            font-weight: 400;
        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #d6d6d2;

            border-radius: 5px;

            background: #ffffff;

            color: #333333;

            transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
        }


        input,
        select {

            height: 36px;

            padding: 0 10px;
        }


        textarea {

            min-height: 105px;

            padding: 10px;

            resize: vertical;
        }


        input::placeholder,
        textarea::placeholder {

            color: #9d9d9d;
        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: #7d9dd7;

            box-shadow:
                    0 0 0 2px
                    rgba(78, 116, 184, 0.10);
        }


        .input-error {

            border-color: #cf5b53 !important;

            background: #fffdfd;
        }


        .field-error {

            display: flex;

            align-items: center;

            gap: 5px;

            margin-top: 5px;

            color: #ba433b;

            font-size: 11px;
        }


        .error-icon {

            width: 13px;

            height: 13px;

            display: inline-flex;

            justify-content: center;

            align-items: center;

            border: 1px solid #c65a53;

            border-radius: 50%;

            font-size: 8px;

            font-weight: bold;
        }


        .inventory-row {

            display: flex;
        }


        .stock-field {

            width: calc(50% - 9px);
        }


        .description-footer {

            margin-top: 5px;

            color: #929292;

            font-size: 10px;
        }


        .form-actions {

            display: flex;

            gap: 8px;

            margin-top: 18px;

            padding-top: 16px;

            border-top: 1px solid #e3e3e0;
        }


        .primary-button,
        .secondary-button {

            min-height: 34px;

            padding: 0 14px;

            border-radius: 5px;

            font-size: 12px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 5px;
        }


        .primary-button {

            background: white;

            border: 1px solid #bdbdb8;

            color: #222222;

            font-weight: 600;
        }


        .primary-button:hover {

            background: #f5f5f3;
        }


        .secondary-button {

            background: white;

            border: 1px solid #d2d2ce;

            color: #4b4b4b;
        }


        .secondary-button:hover {

            background: #f6f6f4;
        }


        @media (max-width: 760px) {

            .page-shell {

                padding: 14px;
            }


            .form-card {

                width: 100%;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .stock-field {

                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="page-shell">


    <div class="form-card">


        <!-- Breadcrumb -->

        <div class="breadcrumb">


            <span class="grid-icon">
                ⠿
            </span>


            <a th:href="@{/}">

                Products

            </a>


            <span class="separator">
                ›
            </span>


            <strong
                    th:text="${formMode == 'edit'}
                        ? 'Edit product'
                        : 'Add new product'">

                Add new product

            </strong>


        </div>


        <!--
            Classroom demo helpers.

            These buttons populate different values
            in the form.

            Validation is still performed on the
            server by Spring.
        -->

        <div
                class="demo-toolbar"
                th:if="${formMode == 'create'}">


            <button
                    type="button"
                    class="demo-button"
                    onclick="setCleanForm()">

                Clean form

            </button>


            <button
                    type="button"
                    class="demo-button"
                    onclick="setInvalidForm()">

                With validation errors

            </button>


            <button
                    type="button"
                    class="demo-button"
                    onclick="setSuccessForm()">

                Success state

            </button>


        </div>


        <!--
            Create:
            POST /products

            Edit:
            POST /products/{id}
        -->

        <form
                th:object="${product}"
                th:action="${formMode == 'edit'}
                    ? @{/products/{id}(id=${product.id})}
                    : @{/products}"
                method="post">


            <!-- Validation Summary -->

            <div
                    class="validation-summary"
                    th:if="${#fields.hasAnyErrors()}">


                <span class="validation-icon">
                    !
                </span>


                <span>

                    Please fix

                    <strong
                            th:text="${#fields.detailedErrors().size()}">

                        0

                    </strong>

                    error(s) before saving.

                </span>


            </div>


            <!-- BASIC INFORMATION -->

            <div class="section-header">

                BASIC INFORMATION

            </div>


            <div class="form-grid">


                <!-- Product Name -->

                <div class="form-group">


                    <label for="name">

                        Product name

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                            id="name"
                            type="text"
                            th:field="*{name}"
                            th:classappend="
                                ${#fields.hasErrors('name')}
                                ? ' input-error'
                                : ''"
                            placeholder="e.g. Wireless Keyboard Pro">


                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('name')}">


                        <span class="error-icon">
                            !
                        </span>


                        <span
                                th:errors="*{name}">
                        </span>


                    </div>


                </div>


                <!-- Type -->

                <div class="form-group">


                    <label for="type">

                        Type

                        <span class="field-hint">
                            (min 3 chars)
                        </span>

                    </label>


                    <input
                            id="type"
                            type="text"
                            th:field="*{type}"
                            th:classappend="
                                ${#fields.hasErrors('type')}
                                ? ' input-error'
                                : ''"
                            placeholder="e.g. Electronics">


                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('type')}">


                        <span class="error-icon">
                            !
                        </span>


                        <span
                                th:errors="*{type}">
                        </span>


                    </div>


                </div>


                <!-- Category -->

                <div class="form-group">


                    <label for="category">

                        Category

                        <span class="required">
                            *
                        </span>

                    </label>


                    <select
                            id="category"
                            th:field="*{category}"
                            th:classappend="
                                ${#fields.hasErrors('category')}
                                ? ' input-error'
                                : ''">


                        <option value="">

                            -- select category --

                        </option>


                        <option value="Peripherals">
                            Peripherals
                        </option>


                        <option value="Accessories">
                            Accessories
                        </option>


                        <option value="Software">
                            Software
                        </option>


                        <option value="Hardware">
                            Hardware
                        </option>


                        <option value="Networking">
                            Networking
                        </option>


                        <option value="Storage">
                            Storage
                        </option>


                    </select>


                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('category')}">


                        <span class="error-icon">
                            !
                        </span>


                        <span
                                th:errors="*{category}">
                        </span>


                    </div>


                </div>


                <!-- Price -->

                <div class="form-group">


                    <label for="price">

                        Price

                        <span class="required">
                            *
                        </span>

                    </label>


                    <input
                            id="price"
                            type="number"
                            step="0.01"
                            th:field="*{price}"
                            th:classappend="
                                ${#fields.hasErrors('price')}
                                ? ' input-error'
                                : ''"
                            placeholder="0.00">


                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('price')}">


                        <span class="error-icon">
                            !
                        </span>


                        <span
                                th:errors="*{price}">
                        </span>


                    </div>


                </div>


            </div>


            <!-- INVENTORY -->

            <div class="section-header">

                INVENTORY

            </div>


            <div class="inventory-row">


                <div class="form-group stock-field">


                    <label for="stockQuantity">

                        Stock quantity

                    </label>


                    <input
                            id="stockQuantity"
                            type="number"
                            th:field="*{stockQuantity}"
                            th:classappend="
                                ${#fields.hasErrors('stockQuantity')}
                                ? ' input-error'
                                : ''"
                            placeholder="0">


                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('stockQuantity')}">


                        <span class="error-icon">
                            !
                        </span>


                        <span
                                th:errors="*{stockQuantity}">
                        </span>


                    </div>


                </div>


            </div>


            <!-- DESCRIPTION -->

            <div class="section-header">

                DESCRIPTION

            </div>


            <div class="form-group">


                <label for="description">

                    Description

                    <span class="field-hint">
                        (max 500 chars)
                    </span>

                </label>


                <textarea
                        id="description"
                        maxlength="500"
                        th:field="*{description}"
                        th:classappend="
                            ${#fields.hasErrors('description')}
                            ? ' input-error'
                            : ''"
                        placeholder="Describe the product..."
                        oninput="updateCharacterCount()">
                </textarea>


                <div class="description-footer">

                    <span id="characterCount">

                        0 / 500

                    </span>

                </div>


                <div
                        class="field-error"
                        th:if="${#fields.hasErrors('description')}">


                    <span class="error-icon">
                        !
                    </span>


                    <span
                            th:errors="*{description}">
                    </span>


                </div>


            </div>


            <!-- Actions -->

            <div class="form-actions">


                <button
                        type="submit"
                        class="primary-button">


                    <span
                            th:text="${formMode == 'edit'}
                                ? 'Update product'
                                : 'Save product'">

                        Save product

                    </span>


                    <span>
                        ↗
                    </span>


                </button>


                <a
                        th:href="@{/}"
                        class="secondary-button">

                    Cancel

                </a>


            </div>


        </form>


    </div>


</div>


<script>

    /*
     * Clear the form.
     */
    function setCleanForm() {

        document.getElementById("name").value = "";

        document.getElementById("type").value = "";

        document.getElementById("category").value = "";

        document.getElementById("price").value = "0.00";

        document.getElementById("stockQuantity").value = "0";

        document.getElementById("description").value = "";

        updateCharacterCount();
    }


    /*
     * Populate deliberately invalid values.
     *
     * Click Save product afterward so that
     * Spring performs server-side validation.
     */
    function setInvalidForm() {

        document.getElementById("name").value =
            "A";

        document.getElementById("type").value =
            "AB";

        document.getElementById("category").value =
            "";

        document.getElementById("price").value =
            "-5";

        document.getElementById("stockQuantity").value =
            "0";

        document.getElementById("description").value =
            "";

        updateCharacterCount();
    }


    /*
     * Populate valid sample values.
     */
    function setSuccessForm() {

        document.getElementById("name").value =
            "Wireless Keyboard Pro";

        document.getElementById("type").value =
            "Electronics";

        document.getElementById("category").value =
            "Peripherals";

        document.getElementById("price").value =
            "89.99";

        document.getElementById("stockQuantity").value =
            "150";

        document.getElementById("description").value =
            "Compact wireless keyboard with reliable connectivity.";

        updateCharacterCount();
    }


    /*
     * Description character counter.
     */
    function updateCharacterCount() {

        const description =
            document.getElementById(
                "description"
            );

        const counter =
            document.getElementById(
                "characterCount"
            );

        counter.textContent =
            description.value.length
            + " / 500";
    }


    document.addEventListener(
        "DOMContentLoaded",
        updateCharacterCount
    );

</script>


</body>

</html>
