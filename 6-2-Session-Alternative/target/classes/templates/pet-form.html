<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Pet</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 680px;
            margin: 50px auto;
        }

        .card {
            background: white;
            border: 1px solid #e1e5ea;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            margin-bottom: 15px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .info {
            padding: 12px 14px;
            margin-bottom: 22px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            color: #1e40af;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        .error {
            margin-top: 5px;
            color: #dc2626;
            font-size: 12px;
        }

        .actions {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
        }

        button {
            padding: 9px 16px;
            border: 1px solid #c7cdd4;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #f8fafc;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <div class="badge">
            @SessionAttributes("pet")
        </div>


        <h1>Edit Pet</h1>


        <div class="info">

            The <strong>pet</strong> object is currently a model
            attribute and is also stored in the HTTP session.

        </div>


        <form
                th:object="${pet}"
                th:action="@{/pets/{id}(id=${pet.id})}"
                method="post">


            <div class="form-group">

                <label for="name">
                    Pet name
                </label>

                <input
                        id="name"
                        type="text"
                        th:field="*{name}">

                <div
                        class="error"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                </div>

            </div>


            <div class="form-group">

                <label for="type">
                    Type
                </label>

                <select
                        id="type"
                        th:field="*{type}">

                    <option value="">
                        -- select type --
                    </option>

                    <option value="Dog">
                        Dog
                    </option>

                    <option value="Cat">
                        Cat
                    </option>

                    <option value="Bird">
                        Bird
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <div
                        class="error"
                        th:if="${#fields.hasErrors('type')}"
                        th:errors="*{type}">
                </div>

            </div>


            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                        id="age"
                        type="number"
                        th:field="*{age}">

                <div
                        class="error"
                        th:if="${#fields.hasErrors('age')}"
                        th:errors="*{age}">
                </div>

            </div>


            <div class="actions">

                <button type="submit">
                    Continue
                </button>

            </div>


        </form>


    </div>

</div>


</body>

</html>
