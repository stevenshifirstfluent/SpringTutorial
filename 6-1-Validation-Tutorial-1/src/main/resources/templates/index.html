<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Products</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            background: #f7f7f5;

            color: #292929;

            font-size: 14px;
        }


        button,
        input,
        select {

            font: inherit;
        }


        .page-shell {

            min-height: 100vh;

            padding: 28px;

            display: flex;

            justify-content: center;

            align-items: flex-start;
        }


        .list-card {

            width: 1050px;

            background: #ffffff;

            border: 1px solid #ddddda;

            border-radius: 6px;

            padding: 18px;

            box-shadow:
                    0 1px 2px
                    rgba(0, 0, 0, 0.04);
        }


        .list-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;
        }


        .breadcrumb {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 18px;

            color: #767676;

            font-size: 12px;
        }


        .breadcrumb strong {

            color: #333333;
        }


        .separator {

            color: #aaaaaa;
        }


        .product-count {

            color: #7e7e7e;

            font-size: 11px;
        }


        .success-alert {

            display: flex;

            align-items: center;

            gap: 8px;

            margin: 2px 0 18px;

            padding: 11px 13px;

            background: #f0f7e8;

            border: 1px solid #8cae67;

            border-radius: 5px;

            color: #537139;

            font-size: 12px;
        }


        .success-icon {

            width: 17px;

            height: 17px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #6d964b;

            border-radius: 50%;

            font-size: 10px;

            font-weight: bold;
        }


        .table-toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 14px;

            margin-bottom: 15px;
        }


        .toolbar-left {

            display: flex;

            gap: 10px;
        }


        .search-box {

            width: 250px;

            height: 36px;

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 0 10px;

            border: 1px solid #d5d5d1;

            border-radius: 5px;

            background: white;
        }


        .search-box input {

            width: 100%;

            border: 0;

            outline: none;

            background: transparent;
        }


        .category-filter {

            width: 190px;

            height: 36px;

            padding: 0 10px;

            border: 1px solid #d5d5d1;

            border-radius: 5px;

            background: white;
        }


        .add-product-button {

            min-height: 36px;

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 0 14px;

            background: white;

            border: 1px solid #bdbdb9;

            border-radius: 5px;

            color: #292929;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;
        }


        .add-product-button:hover {

            background: #f7f7f5;
        }


        .plus {

            font-size: 17px;
        }


        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            table-layout: fixed;
        }


        thead th {

            padding: 10px 8px;

            border-bottom: 1px solid #dededb;

            color: #777777;

            font-size: 10px;

            font-weight: 600;

            text-align: left;
        }


        tbody td {

            padding: 11px 8px;

            border-bottom: 1px solid #ebebe8;

            color: #444444;

            font-size: 11px;

            vertical-align: middle;
        }


        .product-name {

            color: #292929;

            font-weight: 600;
        }


        .price {

            color: #222222;

            font-weight: 600;
        }


        .description-cell {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #777777;
        }


        th:nth-child(1) {
            width: 17%;
        }

        th:nth-child(2) {
            width: 13%;
        }

        th:nth-child(3) {
            width: 15%;
        }

        th:nth-child(4) {
            width: 11%;
        }

        th:nth-child(5) {
            width: 10%;
        }

        th:nth-child(6) {
            width: 25%;
        }

        th:nth-child(7) {
            width: 9%;
        }


        .category-badge {

            display: inline-block;

            padding: 3px 7px;

            border-radius: 10px;

            font-size: 9px;

            background: #f0f0ee;

            color: #555555;
        }


        .category-peripherals {

            background: #e9f3fb;

            color: #39719e;
        }


        .category-accessories {

            background: #e8f5ef;

            color: #35735a;
        }


        .category-software {

            background: #f0ebfb;

            color: #655298;
        }


        .category-hardware {

            background: #faf1df;

            color: #936d31;
        }


        .category-networking {

            background: #faebf0;

            color: #95516a;
        }


        .category-storage {

            background: #edf1f4;

            color: #536978;
        }


        .normal-stock {

            color: #568348;
        }


        .low-stock {

            color: #a65d50;
        }


        .warning-icon {

            font-size: 9px;
        }


        .edit-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 5px 10px;

            background: white;

            border: 1px solid #d2d2ce;

            border-radius: 5px;

            color: #555555;

            font-size: 10px;

            text-decoration: none;
        }


        .edit-button:hover {

            background: #f5f5f3;
        }


        .table-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 16px;
        }


        .showing-text {

            color: #8b8b8b;

            font-size: 10px;
        }


        .pagination {

            display: flex;

            gap: 5px;
        }


        .pagination button {

            width: 34px;

            height: 30px;

            background: white;

            border: 1px solid #d5d5d1;

            border-radius: 5px;

            color: #555555;

            font-size: 11px;
        }


        .pagination button.active {

            background: #f5f5f3;

            color: #222222;

            font-weight: 600;
        }


        .pagination button:disabled {

            cursor: default;

            opacity: 1;
        }


        @media (max-width: 760px) {

            .page-shell {

                padding: 14px;
            }


            .list-card {

                width: 100%;
            }


            .table-toolbar {

                align-items: stretch;

                flex-direction: column;
            }


            .toolbar-left {

                flex-direction: column;
            }


            .search-box,
            .category-filter {

                width: 100%;
            }


            .add-product-button {

                align-self: flex-start;
            }
        }

    </style>

</head>


<body>


<div class="page-shell">


    <div class="list-card">


        <!-- Header -->

        <div class="list-header">


            <div class="breadcrumb">

                <span>
                    Products
                </span>

                <span class="separator">
                    ›
                </span>

                <strong>
                    All products
                </strong>

            </div>


            <div class="product-count">

                <span
                        th:text="${products.size()}">

                    0

                </span>

                items

            </div>


        </div>


        <!-- Success message -->

        <div
                class="success-alert"
                th:if="${successMessage}">


            <span class="success-icon">
                ✓
            </span>


            <span
                    th:text="${successMessage}">
            </span>


        </div>


        <!-- Toolbar -->

        <div class="table-toolbar">


            <div class="toolbar-left">


                <div class="search-box">

                    <span>
                        ⌕
                    </span>


                    <input
                            id="productSearch"
                            type="text"
                            placeholder="Search products..."
                            oninput="filterProducts()">

                </div>


                <select
                        id="categoryFilter"
                        class="category-filter"
                        onchange="filterProducts()">


                    <option value="">

                        All categories

                    </option>


                    <option value="Peripherals">
                        Peripherals
                    </option>


                    <option value="Accessories">
                        Accessories
                    </option>


                    <option value="Software">
                        Software
                    </option>


                    <option value="Hardware">
                        Hardware
                    </option>


                    <option value="Networking">
                        Networking
                    </option>


                    <option value="Storage">
                        Storage
                    </option>


                </select>


            </div>


            <a
                    class="add-product-button"
                    th:href="@{/products/new}">


                <span class="plus">
                    +
                </span>


                Add product


            </a>


        </div>


        <!-- Product table -->

        <div class="table-wrapper">


            <table id="productTable">


                <thead>


                <tr>

                    <th>
                        NAME
                    </th>

                    <th>
                        TYPE
                    </th>

                    <th>
                        CATEGORY
                    </th>

                    <th>
                        PRICE
                    </th>

                    <th>
                        STOCK
                    </th>

                    <th>
                        DESCRIPTION
                    </th>

                    <th>
                        ACTION
                    </th>

                </tr>


                </thead>


                <tbody>


                <tr
                        class="product-row"
                        th:each="product : ${products}"
                        th:data-name="${product.name}"
                        th:data-category="${product.category}">


                    <!-- Name -->

                    <td class="product-name">

                        <span
                                th:text="${product.name}">
                        </span>

                    </td>


                    <!-- Type -->

                    <td
                            th:text="${product.type}">
                    </td>


                    <!-- Category -->

                    <td>

                        <span
                                class="category-badge"
                                th:classappend="
                                    ${' category-' +
                                    #strings.toLowerCase(
                                        product.category
                                    )}"
                                th:text="${product.category}">
                        </span>

                    </td>


                    <!-- Price -->

                    <td class="price">

                        $

                        <span
                                th:text="${#numbers.formatDecimal(
                                    product.price,
                                    1,
                                    2
                                )}">
                        </span>

                    </td>


                    <!-- Stock -->

                    <td>


                        <span
                                th:classappend="
                                    ${product.stockQuantity < 10}
                                    ? ' low-stock'
                                    : ' normal-stock'">


                            <span
                                    th:if="${product.stockQuantity < 10}"
                                    class="warning-icon">

                                ⚠

                            </span>


                            <span
                                    th:text="${product.stockQuantity}">
                            </span>


                        </span>


                    </td>


                    <!-- Description -->

                    <td class="description-cell">

                        <span
                                th:text="${product.description}">
                        </span>

                    </td>


                    <!-- Edit -->

                    <td>


                        <a
                                class="edit-button"
                                th:href="@{/products/{id}/edit(
                                    id=${product.id}
                                )}">

                            Edit

                        </a>


                    </td>


                </tr>


                </tbody>


            </table>


        </div>


        <!-- Table Footer -->

        <div class="table-footer">


            <div class="showing-text">

                Showing

                <span
                        id="visibleCount"
                        th:text="${products.size()}">

                    0

                </span>

                of

                <span
                        th:text="${products.size()}">

                    0

                </span>

                products

            </div>


            <!--
                Only one page is currently used.

                This intentionally does NOT display
                fake Previous / Next / Page 2 buttons.
            -->

            <div
                    class="pagination"
                    th:if="${!products.isEmpty()}">


                <button
                        type="button"
                        class="active"
                        disabled>

                    1

                </button>


            </div>


        </div>


    </div>


</div>


<script>

    /*
     * Client-side filtering.
     *
     * No server request is required because
     * the demo currently displays one page
     * of products.
     */
    function filterProducts() {

        const searchValue =
            document
                .getElementById(
                    "productSearch"
                )
                .value
                .toLowerCase();


        const categoryValue =
            document
                .getElementById(
                    "categoryFilter"
                )
                .value;


        const rows =
            document.querySelectorAll(
                ".product-row"
            );


        let visibleCount = 0;


        rows.forEach(
            row => {


                const name =
                    row.dataset.name
                        .toLowerCase();


                const category =
                    row.dataset.category;


                const matchesSearch =
                    name.includes(
                        searchValue
                    );


                const matchesCategory =
                    categoryValue === ""
                    ||
                    category === categoryValue;


                if (
                    matchesSearch
                    &&
                    matchesCategory
                ) {

                    row.style.display = "";

                    visibleCount++;

                }
                else {

                    row.style.display = "none";

                }

            }
        );


        document
            .getElementById(
                "visibleCount"
            )
            .textContent =
            visibleCount;
    }

</script>


</body>

</html>
