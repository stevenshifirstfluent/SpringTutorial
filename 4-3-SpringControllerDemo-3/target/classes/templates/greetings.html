<!-- src/main/resources/templates/greetings.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring MVC Title</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/style.css}" />
</head>
<body>
    <h1>Greetings Page</h1>

    <!-- Message comes from messages.properties -->
    <p th:text="#{home.welcome}">Welcome to our Spring MVC Demo!</p>

    <!-- Date comes from model attribute -->
    <p>Today is: <span th:text="${today}">1 January 2020</span></p>
</body>
</html>
