spring.application.name=job-application-session-demo
server.port=8085

# In-memory H2 database.
# Nothing is written to this database until the user clicks final Submit.
spring.datasource.url=jdbc:h2:mem:jobapplicationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
