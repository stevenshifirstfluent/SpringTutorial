spring.application.name=retailhub-rest-session1-demo
server.port=8081

# H2 teaching database
spring.datasource.url=jdbc:h2:mem:retailhub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console for optional classroom inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Make JSON easy to read in Postman/browser demos
spring.jackson.serialization.indent-output=true

# Development-friendly template behaviour
spring.thymeleaf.cache=false
