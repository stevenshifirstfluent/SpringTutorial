<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Review Pet</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 680px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 28px;
            border: 1px solid #e1e5ea;
            border-radius: 10px;
        }

        .success {
            padding: 12px;
            margin-bottom: 20px;
            background: #ecfdf5;
            border: 1px solid #86b994;
            border-radius: 6px;
            color: #166534;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        td:first-child {
            width: 150px;
            font-weight: bold;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button,
        a {
            display: inline-block;
            padding: 9px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            color: #222;
            text-decoration: none;
            cursor: pointer;
        }

        .complete {
            border-color: #dc2626;
            color: #b91c1c;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <h1>Pet in Session</h1>


        <div class="success">

            This is a new HTTP request, but the
            <strong>pet</strong> object is still available
            because of <strong>@SessionAttributes("pet")</strong>.

        </div>


        <table>

            <tr>

                <td>ID</td>

                <td th:text="${pet.id}">
                </td>

            </tr>


            <tr>

                <td>Name</td>

                <td th:text="${pet.name}">
                </td>

            </tr>


            <tr>

                <td>Type</td>

                <td th:text="${pet.type}">
                </td>

            </tr>


            <tr>

                <td>Age</td>

                <td th:text="${pet.age}">
                </td>

            </tr>

        </table>


        <div class="actions">


            <a th:href="@{/pets/form}">

                Edit again

            </a>


            <form
                    th:action="@{/pets/complete}"
                    method="post">


                <button
                        class="complete"
                        type="submit">

                    status.setComplete()

                </button>


            </form>


        </div>


    </div>

</div>


</body>

</html>
